version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kalorix_db
    restart: always
    environment:
      POSTGRES_DB: kalorix_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kalorix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: kalorix_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-YOUR_BOT_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-YOUR_OPENROUTER_KEY}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      FREE_MODEL: google/gemma-4-31b-it:free
      FALLBACK_MODEL: openrouter/free
      VIP_MODEL: google/gemini-2.5-pro
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/kalorix_db
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:8000/web_app}
      HOST: 0.0.0.0
      PORT: 8000
      USER_FREE_DAILY_LIMIT: 10
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
